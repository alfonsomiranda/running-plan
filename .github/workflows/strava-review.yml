name: Strava Review

on:
  schedule:
    - cron: '0 19 * * 0'   # domingos: 20:00 CET / 21:00 CEST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch week from Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python3 scripts/strava_sync.py fetch 7

      - name: Deterministic review
        run: python3 scripts/review.py

      - name: Build site
        run: python3 scripts/build.py

      - name: Commit and push
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add scripts/fitness.json scripts/review_log.json scripts/weeks_full.json index.html
          git diff --cached --quiet || git commit -m "Recalibración semanal determinista desde Strava"
          git push
